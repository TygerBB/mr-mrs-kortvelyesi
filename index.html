<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jázmin &amp; Martin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f7f4ef;
      color: #3a3632;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(2.5rem, 10vw, 5rem);
      font-weight: normal;
      letter-spacing: 0.04em;
    }
    .amp { font-style: italic; color: #b08d57; }
    .vonal { width: 80px; height: 1px; background: #b08d57; margin: 2rem auto; }
    p {
      font-size: 0.95rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #8a827a;
    }
  </style>
</head>
<body>
  <h1>Jázmin <span class="amp">&amp;</span> Martin</h1>
  <div class="vonal"></div>
  <p>Hamarosan</p>
</body>
</html>
